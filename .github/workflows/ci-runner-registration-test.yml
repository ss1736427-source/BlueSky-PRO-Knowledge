name: CI Runner Registration Test

on:
  push:
    branches:
      - ci-runner-registration-test
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner reached
        run: |
          echo "runner-registration-test-ok"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
